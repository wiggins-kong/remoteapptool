name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag and stamp assembly
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $parts = $version.Split('.')
          # Windows assembly/MSI versions have four parts. A five-part tag like
          # v6.1.0.0.1 is upstream 6.1.0.0 plus fork revision 1 -> 6.1.0.1.
          $appVersion = if ($parts.Count -ge 5) {
            "$($parts[0]).$($parts[1]).$($parts[2]).$($parts[4])"
          } else {
            $version
          }
          $appVersion = (@($appVersion.Split('.')) + @('0', '0', '0'))[0..3] -join '.'

          "version=$version" >> $env:GITHUB_OUTPUT
          "app=$appVersion" >> $env:GITHUB_OUTPUT
          "asset=$($version -replace '\.', '')" >> $env:GITHUB_OUTPUT

          $file = 'remoteapp-tool/My Project/AssemblyInfo.vb'
          (Get-Content $file) `
            -replace '^<Assembly: AssemblyVersion\("[^"]+"\)>', "<Assembly: AssemblyVersion(`"$appVersion`")>" `
            -replace '^<Assembly: AssemblyFileVersion\("[^"]+"\)>', "<Assembly: AssemblyFileVersion(`"$appVersion`")>" |
            Set-Content $file

      - uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild "remoteapp-tool\RemoteApp Tool.sln" /t:Rebuild /p:Configuration=Release /p:TargetFrameworkVersion=v4.8 /p:Platform="Any CPU" /v:minimal /nologo

      - name: Build portable zip
        shell: pwsh
        run: |
          $out = 'remoteapp-tool\bin\Release'
          $files = @(
            'RemoteApp Tool.exe', 'RemoteAppLib.dll', 'IconLib.dll', 'LockChecker.dll',
            'RDP2MSI.exe', 'RDP2MSIlib.dll', 'RDPFileLib.dll', 'RDPSign.dll'
          ) | ForEach-Object { Join-Path $out $_ }
          $files += 'remoteapp-tool\add-window.ico'

          $missing = $files | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Missing build output: $($missing -join ', ')" }

          New-Item dist -ItemType Directory -Force | Out-Null
          Compress-Archive -Path $files -DestinationPath "dist\RemoteApp.Tool.${{ steps.version.outputs.asset }}.zip"

      - name: Install WiX
        run: |
          dotnet tool install --tool-path .wix wix --version 5.0.2
          .\.wix\wix.exe extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build MSI
        shell: pwsh
        run: |
          .\.wix\wix.exe build installer\RemoteAppTool.wxs -ext WixToolset.UI.wixext `
            -d BuildDir="${{ github.workspace }}\remoteapp-tool\bin\Release" `
            -d ProductVersion="${{ steps.version.outputs.app }}" `
            -o "dist\RemoteApp.Tool.${{ steps.version.outputs.asset }}.msi"
          if (-not (Test-Path "dist\RemoteApp.Tool.${{ steps.version.outputs.asset }}.msi")) { throw 'MSI was not created' }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: RemoteApp Tool ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.msi
            dist/*.zip
